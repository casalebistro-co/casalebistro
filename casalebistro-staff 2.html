<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CLB Staff">
<meta name="theme-color" content="#111d33">
<title>Casa Le Bistró — Staff</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Raleway:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--navy:#1B2A4A;--navy-deep:#111d33;--navy-mid:#243660;--gold:#C8A96E;--gold-light:#e2c99a;--white:#FFFFFF;--text-muted:rgba(255,255,255,0.5);}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{background:var(--navy-deep);color:var(--white);font-family:'Raleway',sans-serif;font-weight:300;min-height:100vh;}
  .screen{display:none;min-height:100vh;flex-direction:column;animation:fadeIn 0.3s ease;}
  .screen.active{display:flex;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  #screen-login{align-items:center;justify-content:center;padding:48px 32px;text-align:center;background:linear-gradient(160deg,var(--navy-deep) 0%,var(--navy) 100%);}
  .staff-logo{width:80px;height:80px;margin:0 auto 28px;}
  .staff-logo img{width:100%;height:100%;object-fit:contain;}
  .login-eyebrow{font-size:10px;letter-spacing:0.3em;text-transform:uppercase;color:var(--gold);margin-bottom:10px;}
  .login-title{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:700;margin-bottom:8px;}
  .login-sub{font-size:12px;color:var(--text-muted);margin-bottom:40px;}
  .pin-inputs{display:flex;gap:12px;justify-content:center;margin-bottom:32px;}
  .pin-dot{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);transition:all 0.2s;}
  .pin-dot.filled{background:var(--gold);border-color:var(--gold);}
  .numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:260px;margin:0 auto;}
  .num-btn{padding:18px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);color:white;font-family:'Cormorant Garamond',serif;font-size:22px;cursor:pointer;transition:all 0.15s;}
  .num-btn:hover{background:rgba(200,169,110,0.12);border-color:rgba(200,169,110,0.3);}
  .num-btn:active{transform:scale(0.96);}
  .num-btn.del{font-family:'Raleway',sans-serif;font-size:14px;color:var(--text-muted);}
  .num-btn.enter{background:rgba(200,169,110,0.15);border-color:rgba(200,169,110,0.4);color:var(--gold);font-size:12px;font-family:'Raleway',sans-serif;letter-spacing:0.1em;}
  .login-error{font-size:12px;color:rgba(255,100,100,0.8);margin-top:16px;display:none;}

  #screen-panel{background:var(--navy-deep);}
  .panel-header{background:var(--navy);padding:44px 24px 20px;border-bottom:1px solid rgba(255,255,255,0.07);}
  .panel-header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .panel-logo-wrap{display:flex;align-items:center;gap:12px;}
  .panel-logo{width:38px;height:38px;}
  .panel-logo img{width:100%;height:100%;object-fit:contain;}
  .panel-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:700;}
  .panel-subtitle{font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold);}
  .logout-btn{background:none;border:1px solid rgba(255,255,255,0.1);color:var(--text-muted);padding:8px 14px;font-family:'Raleway',sans-serif;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;}
  .search-wrap{position:relative;}
  .search-input{width:100%;padding:14px 14px 14px 40px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:white;font-family:'Raleway',sans-serif;font-size:14px;outline:none;}
  .search-input:focus{border-color:var(--gold);}
  .search-input::placeholder{color:rgba(255,255,255,0.25);}
  .search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:16px;}

  .add-section{padding:20px 24px;border-bottom:1px solid rgba(255,255,255,0.05);}
  .add-label{font-size:9px;letter-spacing:0.22em;text-transform:uppercase;color:var(--gold);margin-bottom:12px;}
  .add-row{display:flex;gap:8px;margin-bottom:10px;}
  .add-input{flex:1;padding:11px 12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:white;font-family:'Raleway',sans-serif;font-size:13px;outline:none;}
  .add-input:focus{border-color:var(--gold);}
  .add-input::placeholder{color:rgba(255,255,255,0.2);}
  input[type="date"].add-input{color-scheme:dark;}
  .btn-add{padding:11px 16px;background:var(--gold);color:var(--navy-deep);border:none;font-family:'Raleway',sans-serif;font-size:11px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;white-space:nowrap;}
  .confirm-banner{display:none;margin-top:12px;padding:12px 16px;background:rgba(200,169,110,0.12);border:1px solid rgba(200,169,110,0.35);align-items:center;gap:12px;}
  .confirm-banner.active{display:flex;}

  .clients-list{padding:0 24px;}
  .client-row{display:flex;align-items:center;padding:14px 0;border-bottom:1px solid rgba(255,255,255,0.05);gap:12px;}
  .client-avatar{width:38px;height:38px;border-radius:50%;background:rgba(200,169,110,0.12);border:1px solid rgba(200,169,110,0.2);display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:16px;color:var(--gold);flex-shrink:0;}
  .client-info{flex:1;min-width:0;}
  .client-name{font-size:14px;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .client-phone{font-size:11px;color:var(--text-muted);}
  .client-pts{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--gold);min-width:56px;text-align:right;flex-shrink:0;}
  .purchase-row{display:flex;gap:6px;align-items:center;}
  .purchase-input{width:80px;padding:7px 8px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:white;font-family:'Raleway',sans-serif;font-size:13px;text-align:center;outline:none;}
  .purchase-input:focus{border-color:var(--gold);}
  .btn-add-pts{padding:7px 12px;background:rgba(200,169,110,0.15);border:1px solid rgba(200,169,110,0.3);color:var(--gold);font-family:'Raleway',sans-serif;font-size:11px;cursor:pointer;white-space:nowrap;}

  .loading-overlay{display:none;position:fixed;inset:0;background:rgba(10,15,26,0.7);z-index:500;align-items:center;justify-content:center;flex-direction:column;gap:16px;}
  .loading-overlay.active{display:flex;}
  .spinner{width:36px;height:36px;border:2px solid rgba(200,169,110,0.2);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--gold);color:var(--navy-deep);padding:14px 24px;font-size:12px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1);z-index:200;white-space:nowrap;}
  .toast.show{transform:translateX(-50%) translateY(0);}
  .empty-state{text-align:center;padding:40px 24px;color:var(--text-muted);font-size:13px;line-height:1.7;}
</style>
</head>

<script>
const SUPA_URL = 'https://bcknrelowvydxtpyakdh.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJja25yZWxvd3Z5ZHh0cHlha2RoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzMjAyOTQsImV4cCI6MjA5NDg5NjI5NH0.Ba-dvNKdOKCltsUKBI_X-OPc3VhrUzbKGK4P9yyy86E';
const STAFF_PIN = '1234';

let pin = '';
let clients = [];

// ── PING ──
async function ping() {
  try {
    await fetch(SUPA_URL+'/rest/v1/clientes?select=id&limit=1',{headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}});
  } catch(e) {}
}
ping();
setInterval(ping, 1000*60*60*24*4);

// ── SUPABASE ──
async function sbAll() {
  const r = await fetch(SUPA_URL+'/rest/v1/clientes?select=*&order=nombre.asc',{
    headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}
  });
  return await r.json();
}

async function sbInsert(c) {
  const r = await fetch(SUPA_URL+'/rest/v1/clientes',{
    method:'POST',
    headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'return=representation'},
    body:JSON.stringify(c)
  });
  const d = await r.json();
  return d[0]||null;
}

async function sbUpdate(id,fields) {
  await fetch(SUPA_URL+'/rest/v1/clientes?id=eq.'+id,{
    method:'PATCH',
    headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'},
    body:JSON.stringify(fields)
  });
}

// ── PIN ──
function pinPress(n){if(pin.length>=4)return;pin+=n;updateDots();}
function pinDelete(){pin=pin.slice(0,-1);updateDots();document.getElementById('login-error').style.display='none';}
function updateDots(){for(let i=0;i<4;i++)document.getElementById('dot-'+i).classList.toggle('filled',i<pin.length);}

async function pinEnter(){
  if(pin===STAFF_PIN){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById('screen-panel').classList.add('active');
    showLoading(true);
    clients = await sbAll();
    showLoading(false);
    renderClients();
  }else{
    document.getElementById('login-error').style.display='block';
    pin='';updateDots();
  }
}

function logout(){
  pin='';updateDots();
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-login').classList.add('active');
}

// ── RENDER ──
function renderClients(){
  const q=document.getElementById('search-input').value.toLowerCase();
  const filtered=q?clients.filter(c=>c.nombre.toLowerCase().includes(q)||c.telefono.includes(q)):clients;
  const el=document.getElementById('clients-list');
  if(filtered.length===0){el.innerHTML='<div class="empty-state">No se encontraron clientes.</div>';return;}
  el.innerHTML=filtered.map(c=>{
    const bday=c.cumpleanos?'🎂 '+new Date(c.cumpleanos+'T00:00:00').toLocaleDateString('es-CO',{day:'numeric',month:'long'}):'';
    return `<div class="client-row">
      <div class="client-avatar">${c.nombre.charAt(0)}</div>
      <div class="client-info">
        <div class="client-name">${c.nombre}</div>
        <div class="client-phone">${c.telefono}${bday?' · '+bday:''}</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
        <div class="client-pts">${c.puntos} pts</div>
        <div class="purchase-row">
          <input class="purchase-input" id="pur-${c.id}" placeholder="$" type="number" min="0">
          <button class="btn-add-pts" onclick="addPurchase(${c.id})">+ pts</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── ADD CLIENT ──
async function addClient(){
  const nombre=document.getElementById('new-name').value.trim();
  const telefono=document.getElementById('new-phone').value.trim().replace(/[\s\-\+]/g,'');
  const cumpleanos=document.getElementById('new-birthday').value||null;
  if(!nombre||!telefono){showToast('Ingresa nombre y teléfono');return;}
  if(clients.find(c=>c.telefono===telefono)){showToast('Este cliente ya existe');return;}
  showLoading(true);
  const today=new Date().toLocaleDateString('es-CO',{day:'numeric',month:'long'});
  const nc=await sbInsert({nombre,telefono,cumpleanos,puntos:0,historial:[{desc:'Registro en caja',pts:0,date:today}]});
  showLoading(false);
  if(nc){
    clients.push(nc);
    document.getElementById('new-name').value='';
    document.getElementById('new-phone').value='';
    document.getElementById('new-birthday').value='';
    renderClients();
    document.getElementById('confirm-name').textContent=nombre;
    const banner=document.getElementById('add-confirm');
    banner.classList.add('active');
    setTimeout(()=>banner.classList.remove('active'),4000);
    showToast(nombre.split(' ')[0]+' registrado ✦');
  }else{showToast('Error al registrar. Intenta de nuevo.');}
}

// ── ADD PURCHASE ──
async function addPurchase(id){
  const input=document.getElementById('pur-'+id);
  const amount=parseInt(input.value);
  if(!amount||amount<3000){showToast('Monto mínimo: $3.000');return;}
  const pts=Math.floor(amount/3000);
  const c=clients.find(x=>x.id===id);
  if(!c)return;
  c.puntos+=pts;
  const today=new Date().toLocaleDateString('es-CO',{day:'numeric',month:'long'});
  const historial=[...(c.historial||[]),{desc:'Compra $'+amount.toLocaleString('es-CO'),pts,date:today}];
  showLoading(true);
  await sbUpdate(id,{puntos:c.puntos,historial});
  c.historial=historial;
  showLoading(false);
  input.value='';
  renderClients();
  showToast('+'+pts+' puntos para '+c.nombre.split(' ')[0]);
}

function showLoading(v){document.getElementById('loading').classList.toggle('active',v);}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600);}
</script>
